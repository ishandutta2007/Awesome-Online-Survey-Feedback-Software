<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#818cf8" flood-opacity="0.6"/>
    </filter>

    <!-- Dynamic / Pulsing CSS Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(1deg); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes barGrow1 {
        0%, 100% { height: 35px; y: 45px; }
        50% { height: 60px; y: 20px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 50px; y: 30px; }
        50% { height: 25px; y: 55px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 65px; y: 15px; }
        50% { height: 75px; y: 5px; }
      }
      @keyframes starSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .float-card-left {
        animation: floatSlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .float-card-right {
        animation: floatFast 7s ease-in-out infinite;
        transform-origin: center;
      }
      .pulse-orb {
        animation: pulseLight 5s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-dash {
        stroke-dasharray: 8, 8;
        animation: dashMove 15s linear infinite;
      }
      .bar-anim-1 {
        animation: barGrow1 4s ease-in-out infinite;
      }
      .bar-anim-2 {
        animation: barGrow2 4.5s ease-in-out infinite;
      }
      .bar-anim-3 {
        animation: barGrow3 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Animated Glowing Ambience in Background -->
  <circle cx="180" cy="180" r="160" fill="url(#glowGradient)" class="pulse-orb" />
  <circle cx="1020" cy="160" r="180" fill="url(#glowGradient)" class="pulse-orb" style="animation-delay: -2.5s;" />

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Left Dynamic Element: Interactive Feedback & Survey Card -->
  <g class="float-card-left" transform="translate(60, 65)" filter="url(#shadow)">
    <!-- Glassmorphic Card Container -->
    <rect width="210" height="225" rx="14" fill="url(#cardGradient)" stroke="#334155" stroke-width="1.5" />
    <rect width="210" height="34" rx="14" fill="#1e293b" />
    <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
    <circle cx="36" cy="17" r="4.5" fill="#f59e0b" />
    <circle cx="52" cy="17" r="4.5" fill="#10b981" />
    <text x="110" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Live Survey Flow</text>

    <!-- Survey Questions / Option items -->
    <rect x="18" y="52" width="174" height="26" rx="6" fill="#334155" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
    <circle cx="32" cy="65" r="5" fill="#38bdf8" />
    <line x1="46" y1="65" x2="160" y2="65" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <rect x="18" y="86" width="174" height="26" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="32" cy="99" r="5" fill="#10b981" />
    <path d="M29 99 L31.5 101.5 L35 97" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="46" y1="99" x2="140" y2="99" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <rect x="18" y="120" width="174" height="26" rx="6" fill="#334155" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
    <circle cx="32" cy="133" r="5" stroke="#64748b" stroke-width="2" fill="none" />
    <line x1="46" y1="133" x2="120" y2="133" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

    <!-- Feedback Pill Rating -->
    <g transform="translate(18, 160)">
      <rect width="174" height="48" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="87" y="18" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">CSAT Rating ⭐⭐⭐⭐⭐</text>
      <line x1="20" y1="32" x2="154" y2="32" stroke="#334155" stroke-width="4" stroke-linecap="round" />
      <line x1="20" y1="32" x2="140" y2="32" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>

  <!-- Right Dynamic Element: Analytics & Response Growth Graph -->
  <g class="float-card-right" transform="translate(930, 65)" filter="url(#shadow)">
    <!-- Glassmorphic Card Container -->
    <rect width="210" height="225" rx="14" fill="url(#cardGradient)" stroke="#334155" stroke-width="1.5" />
    <rect width="210" height="34" rx="14" fill="#1e293b" />
    <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
    <circle cx="36" cy="17" r="4.5" fill="#f59e0b" />
    <circle cx="52" cy="17" r="4.5" fill="#10b981" />
    <text x="110" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Response Analytics</text>

    <!-- Animated Bar Chart Area -->
    <g transform="translate(25, 48)">
      <!-- Baseline -->
      <line x1="0" y1="85" x2="160" y2="85" stroke="#475569" stroke-width="1.5" />

      <!-- Bars with dynamic growth animations -->
      <rect x="15" y="45" width="22" height="40" rx="4" fill="#38bdf8" class="bar-anim-1" />
      <rect x="52" y="30" width="22" height="55" rx="4" fill="#6366f1" class="bar-anim-2" />
      <rect x="89" y="15" width="22" height="70" rx="4" fill="#a855f7" class="bar-anim-3" />
      <rect x="126" y="20" width="22" height="65" rx="4" fill="#ec4899" class="bar-anim-1" style="animation-delay: -1.5s;" />
    </g>

    <!-- Metrics Breakdown Cards -->
    <g transform="translate(18, 150)">
      <rect width="82" height="58" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="41" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Responses</text>
      <text x="41" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">+148%</text>

      <rect x="92" width="82" height="58" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="133" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Completion</text>
      <text x="133" y="44" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" text-anchor="middle">92.4%</text>
    </g>
  </g>

  <!-- Center Connecting Animated Curved Trajectory -->
  <path d="M 270 170 C 420 110, 480 230, 600 175 C 720 120, 780 240, 930 170" 
        stroke="#6366f1" stroke-width="2" fill="none" opacity="0.3" class="animated-dash" />

  <!-- Center Foreground Content: Guaranteed Unobstructed Title, Badges & Subtitle -->
  <g transform="translate(600, 115)">
    <!-- Category Pill Badge -->
    <rect x="-140" y="-55" width="280" height="28" rx="14" fill="#1e293b" stroke="#4f46e5" stroke-width="1.5" />
    <text x="0" y="-37" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title (Highest Contrast & Depth) -->
    <text x="0" y="25" fill="url(#titleGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="35" font-weight="900" letter-spacing="-0.5" text-anchor="middle" filter="url(#textGlow)">
      Awesome Survey &amp; Feedback
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="65" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" text-anchor="middle">
      Top SaaS Platforms &amp; Self-Hosted Open-Source Form Builders
    </text>

    <!-- Highlight Feature Tags / Pills -->
    <g transform="translate(0, 105)">
      <!-- Tag 1 -->
      <g transform="translate(-190, 0)">
        <rect x="0" y="0" width="115" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
        <text x="57" y="17" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Self-Hosted</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(-65, 0)">
        <rect x="0" y="0" width="130" height="26" rx="13" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1" />
        <text x="65" y="17" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">📊 Experience XM</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(75, 0)">
        <rect x="0" y="0" width="115" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1" />
        <text x="57" y="17" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔒 GDPR &amp; Free</text>
      </g>
    </g>
  </g>
</svg>
